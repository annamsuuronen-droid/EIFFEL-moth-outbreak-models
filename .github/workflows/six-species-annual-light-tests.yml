# No scientific data, model fitting or local storage access; Linux synthetic fixtures only.
name: Six-species annual data light tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'R/build_six_species_annual_v3.R'
      - 'R/validation/VERIFY_LOCAL_TEMP_ROOT_v1.R'
      - 'tools/run_eiffel_build.ps1'
      - 'R/validation/VERIFY_LOCAL_TEMP_ROOT_v1.R'
      - 'tools/run_eiffel_build.ps1'
      - 'tools/tests/test_six_species_annual_v3.R'
      - '.github/workflows/six-species-annual-light-tests.yml'
  pull_request:
    paths:
      - 'R/build_six_species_annual_v3.R'
      - 'R/validation/VERIFY_LOCAL_TEMP_ROOT_v1.R'
      - 'tools/run_eiffel_build.ps1'
      - 'tools/tests/test_six_species_annual_v3.R'
      - '.github/workflows/six-species-annual-light-tests.yml'
permissions:
  contents: read
concurrency:
  group: six-species-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install minimal build dependency
        shell: bash
        run: Rscript --vanilla -e 'install.packages("data.table", repos="https://cloud.r-project.org")'
      - name: Test synthetic data only (no Hmsc fitting)
        shell: bash
        run: Rscript --vanilla tools/tests/test_six_species_annual_v3.R
  windows-temp-preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Windows PowerShell to Rscript temp preflight (no model or study data)
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP 'eiffel_win_temp_fixture'
          New-Item -Path $scratch -ItemType Directory -Force | Out-Null
          $rExe = (Get-Command Rscript.exe -ErrorAction Stop).Source
          & .\tools\run_eiffel_build.ps1 -Mode inspect -TempCheckOnly -Rscript $rExe -RuntimeRoot $scratch -DataRoot $scratch -MinFreeGB 0
          if ($LASTEXITCODE -ne 0) { throw "Windows temp preflight failed" }
