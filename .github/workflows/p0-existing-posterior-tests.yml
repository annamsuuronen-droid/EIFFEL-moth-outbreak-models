name: P0 existing-posterior extraction safety
on:
  push:
    paths:
      - 'R/validation/EXTRACT_P0_EXISTING_POSTERIORS_v1.R'
      - 'tools/extract_p0_existing_evidence.ps1'
      - 'tools/tests/test_p0_posterior_extraction.R'
      - 'tools/tests/Test-P0Extraction.ps1'
      - 'project_state/p0_investigation_v1/LOCAL_EXTRACTION_ALLOWLIST.csv'
      - '.github/workflows/p0-existing-posterior-tests.yml'
  pull_request:
permissions:
  contents: read
jobs:
  arithmetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::coda
            any::posterior
          needs: check
      - name: Base R posterior and observation arithmetic/refusal tests
        shell: Rscript {0}
        run: source('tools/tests/test_p0_posterior_extraction.R')
      - name: Windows PowerShell 5.1 safety
        if: runner.os == 'Windows'
        shell: powershell
        run: '& ./tools/tests/Test-P0Extraction.ps1'
      - name: Windows PowerShell 7 safety
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ./tools/tests/Test-P0Extraction.ps1'
