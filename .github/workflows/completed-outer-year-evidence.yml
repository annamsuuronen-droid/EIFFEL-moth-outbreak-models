name: Completed outer-year evidence safety
on:
  push:
    paths:
      - 'imported_fold5_completed_r2_v1/**'
      - 'project_state/outer_year_cv_full_v1/**'
      - 'tools/verify_fold5_capture.py'
      - 'tools/tests/test_fold5_capture_hashes.py'
      - 'tools/tests/verify_published_outer_year_cv.R'
      - 'tools/capture_completed_fold5.ps1'
      - 'tools/tests/Test-CompletedFold5Capture.ps1'
      - 'tools/tests/test_completed_outer_year_cv.R'
      - 'R/validation/**'
      - 'R/S4_PREDICTIVE_FULL_DATA_v2_CONFIG_PREFLIGHT.R'
      - 'project_state/outer_year_cv_recovery_v1/**'
      - '.github/workflows/completed-outer-year-evidence.yml'
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-windows-safety:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: PowerShell 5.1 parser and synthetic safety tests
        shell: powershell
        run: |
          & ./tools/tests/Test-CompletedFold5Capture.ps1
          & ./tools/tests/Test-EiffelEvidenceImport.ps1
      - name: PowerShell 7 parser and synthetic safety tests
        if: always()
        shell: pwsh
        run: |
          & ./tools/tests/Test-CompletedFold5Capture.ps1
          & ./tools/tests/Test-EiffelEvidenceImport.ps1
      - name: Base R arithmetic and refusal tests
        if: always()
        shell: pwsh
        run: |
          Rscript --vanilla tools/tests/test_completed_outer_year_cv.R
          if ($LASTEXITCODE -ne 0) { throw 'Completed-CV tests failed.' }
          Rscript --vanilla tools/tests/test_nested_cv_reconstruction.R
  synthetic-linux-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - run: |
          Rscript --vanilla tools/tests/test_completed_outer_year_cv.R
          Rscript --vanilla tools/tests/test_nested_cv_reconstruction.R
      - run: python tools/tests/test_fold5_capture_hashes.py
      - name: Independently verify captured SHA256 when evidence arrives
        if: ${{ hashFiles('imported_fold5_completed_r2_v1/artifact_manifest.csv') != '' }}
        run: python tools/verify_fold5_capture.py imported_fold5_completed_r2_v1 --audit project_state/outer_year_cv_full_v1
      - name: Independently recompute published full-year summaries when evidence arrives
        if: ${{ hashFiles('imported_fold5_completed_r2_v1/artifact_manifest.csv') != '' }}
        run: Rscript --vanilla tools/tests/verify_published_outer_year_cv.R
